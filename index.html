<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影像報告系統 雛型</title>
<style>
/* 影像報告撰寫系統｜設計 tokens
   以起始範本為基礎整理，規則說明見 design-system.md。
   標示「新增」的變數是範本沒有、由雛型盤點整理出來的。
   報告狀態色採用 B 組「色覺友善色相」（2026-11-03 決定，取代先前的 C 組）。 */

:root {
  /* ── 色彩：基本 ── */
  --color-primary: #1f5fa8;          /* 主要按鈕、連結、焦點框 */
  --color-primary-hover: #194d88;    /* 新增：主要按鈕滑過 */
  --color-primary-soft: #e8eff8;     /* 新增：選取狀態底色（分項晶片、目前這筆） */
  --color-bg: #ffffff;               /* 卡片、表格、輸入框底色 */
  --color-surface: #f5f7fa;          /* 頁面底色、表頭、次要區塊 */
  --color-text: #1f2933;             /* 主要文字 */
  --color-text-muted: #5f6b7a;       /* 次要文字、欄位標籤 */
  --color-border: #d5dbe3;           /* 卡片與表格分隔線（裝飾用） */
  --color-border-input: #7b8594;     /* 新增：輸入框、次要按鈕框線（對白底 3.7:1） */
  --color-danger: #b42318;           /* 新增：錯誤訊息、危險操作（不與醫令已 DC 共用） */
  --color-danger-bg: #fdeceb;        /* 新增：錯誤訊息底色 */
  --color-focus: #1f5fa8;            /* 新增：鍵盤焦點框 */
  --color-image-bg: #2f343c;         /* 新增：影像顯示區底色 */
  --color-image-text: #c8cdd5;       /* 新增：影像顯示區文字 */
  --color-overlay: rgba(20, 25, 35, .45); /* 新增：對話框遮罩 */

  /* ── 色彩：報告狀態（B 組：色覺友善色相，以 Okabe-Ito 色盤調深） ──
     橘＝未完成、天藍＝已完成、藍綠＝已認證、洋紅紅＝醫令已 DC。
     三種報告狀態都有列底色；標籤底色與列底色相同。
     每個狀態四個變數：
     --status-x         文字、圖示、左側標記
     --status-x-bg      清單列底色
     --status-x-badge   狀態標籤底色
     --status-x-border  狀態標籤框線 */
  --status-pending: #8f4500;   --status-pending-bg: #fdecd8;   --status-pending-badge: #fdecd8;   --status-pending-border: #e7a76a;   /* 未完成 */
  --status-done: #0d5a80;      --status-done-bg: #e0f1fa;      --status-done-badge: #e0f1fa;      --status-done-border: #86c2e2;      /* 已完成 */
  --status-certified: #00624a; --status-certified-bg: #d9f2ea; --status-certified-badge: #d9f2ea; --status-certified-border: #7fc8b2; /* 已認證 */
  --status-dc: #b0204a;        --status-dc-bg: #fbe5ec;        --status-dc-border: #e79ab2;       /* 醫令已 DC：左側標記＋標籤，不當列底色；-bg 只用於標籤與提示框 */

  /* ── 字級 ── */
  --font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --font-family-mono: ui-monospace, "Cascadia Mono", Consolas, monospace; /* 新增：僅用於快捷鍵提示 */
  --font-size-sm: 13px;        /* 欄位標籤、狀態標籤、片語、輔助說明 */
  --font-size-md: 15px;        /* 內文、表格、輸入框、按鈕 */
  --font-size-lg: 18px;        /* 區塊標題、頁面標題 */
  --font-size-xl: 22px;        /* 分項數量 */
  --font-size-display: 40px;   /* 新增：未完成總數（全畫面只用一處） */
  --font-weight-regular: 400;  /* 新增 */
  --font-weight-medium: 600;   /* 新增：標籤、表頭、按鈕 */
  --font-weight-bold: 700;     /* 新增：標題、數字 */
  --line-height: 1.5;          /* 新增 */
  --line-height-tight: 1.2;    /* 新增：大數字 */

  /* ── 間距 ── */
  --space-1: 4px;   /* 圖示與文字、標籤內距 */
  --space-2: 8px;   /* 同組元件之間 */
  --space-3: 12px;  /* 表格儲存格、按鈕水平內距 */
  --space-4: 16px;  /* 卡片內距、區塊之間、頁面左右邊界 */
  --space-6: 24px;  /* 大區塊之間、對話框內距 */

  /* ── 尺寸（新增） ── */
  --control-height: 36px;      /* 輸入框、下拉選單、按鈕統一高度 */
  --row-height: 44px;          /* 清單列最小高度 */
  --status-marker-width: 4px;  /* 醫令已 DC 左側標記寬度 */

  /* ── 圓角 ── */
  --radius: 6px;          /* 按鈕、輸入框 */
  --radius-lg: 8px;       /* 新增：卡片、影像區、對話框 */
  --radius-pill: 999px;   /* 新增：狀態標籤、片語 */

  /* ── 陰影（新增） ── */
  --shadow-overlay: 0 12px 40px rgba(0, 0, 0, .25); /* 對話框、提示訊息 */
}


/* ===== 以下只使用 tokens 變數 ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--color-surface);color:var(--color-text);
  font:var(--font-weight-regular) var(--font-size-md)/var(--line-height) var(--font-family)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
[hidden]{display:none !important}
.muted{color:var(--color-text-muted)}
h1,h2,p{margin:0}

/* 版面 */
.app-header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  min-height:calc(var(--control-height) + var(--space-4));padding:0 var(--space-4);background:var(--color-bg);border-bottom:1px solid var(--color-border)}
.brand{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold)}
.role-tag{padding:0 var(--space-2);border-radius:var(--radius-pill);background:var(--color-primary-soft);color:var(--color-primary);
  font-size:var(--font-size-sm);font-weight:var(--font-weight-medium)}
main{max-width:1480px;margin:0 auto;padding:var(--space-4)}
.card{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-lg)}

/* 圖示 */
.ic{width:14px;height:14px;flex:none}

/* 按鈕：主要／次要 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:var(--control-height);padding:0 var(--space-3);
  border:1px solid var(--color-border-input);border-radius:var(--radius);background:var(--color-bg);color:var(--color-text);
  font-size:var(--font-size-md);font-weight:var(--font-weight-medium);white-space:nowrap;cursor:pointer}
.btn:hover:not(:disabled){background:var(--color-surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-bg)}
.btn-primary:hover:not(:disabled){background:var(--color-primary-hover);border-color:var(--color-primary-hover)}
kbd{font-family:var(--font-family-mono);font-size:var(--font-size-sm);line-height:var(--line-height-tight);padding:0 var(--space-1);
  border:1px solid currentColor;border-radius:var(--radius);opacity:.85}

/* 狀態標籤 */
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border:1px solid;border-radius:var(--radius-pill);
  font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height);white-space:nowrap}
.badge.st-pending{color:var(--status-pending);background:var(--status-pending-badge);border-color:var(--status-pending-border)}
.badge.st-done{color:var(--status-done);background:var(--status-done-badge);border-color:var(--status-done-border)}
.badge.st-cert{color:var(--status-certified);background:var(--status-certified-badge);border-color:var(--status-certified-border)}
.badge.dc{color:var(--status-dc);background:var(--status-dc-bg);border-color:var(--status-dc-border)}
.badge.neutral{color:var(--color-text-muted);background:var(--color-surface);border-color:var(--color-border)}

/* 未完成數量 */
.summary{display:flex;align-items:stretch;gap:var(--space-4);flex-wrap:wrap;padding:var(--space-4);margin-bottom:var(--space-3);
  border-left:var(--status-marker-width) solid var(--status-pending-border)}
.summary-total{display:flex;flex-direction:column;justify-content:center;min-width:160px;padding-right:var(--space-4);border-right:1px solid var(--color-border)}
.summary-label{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:var(--color-text-muted)}
.summary-num{font-size:var(--font-size-display);font-weight:var(--font-weight-bold);line-height:var(--line-height-tight);color:var(--status-pending)}
.summary-unit{margin-left:var(--space-1);color:var(--color-text-muted)}
.summary-cats{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;flex:1}
.cat-chip{display:flex;flex-direction:column;align-items:flex-start;min-width:120px;padding:var(--space-2) var(--space-3);
  border:1px solid var(--color-border-input);border-radius:var(--radius);background:var(--color-bg);text-align:left;cursor:pointer}
.cat-chip:hover{background:var(--color-surface)}
.cat-chip .n{font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);line-height:var(--line-height-tight)}
.cat-chip .t{font-size:var(--font-size-sm);color:var(--color-text-muted)}
.cat-chip.has .n{color:var(--status-pending)}
.cat-chip.zero .n{color:var(--color-text-muted)}
.cat-chip[aria-pressed="true"]{background:var(--color-primary-soft);border-color:var(--color-primary);box-shadow:inset 0 0 0 1px var(--color-primary)}

/* 表單欄位 */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--space-3);align-items:end;padding:var(--space-3) var(--space-4);margin-bottom:var(--space-3)}
.f{display:flex;flex-direction:column;gap:var(--space-1)}
.f-wide{grid-column:span 2}
.f-label,.field-label{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:var(--color-text-muted)}
.input{height:var(--control-height);padding:0 var(--space-2);border:1px solid var(--color-border-input);border-radius:var(--radius);
  background:var(--color-bg);font-size:var(--font-size-md)}
textarea.input{display:block;width:100%;height:auto;min-height:96px;padding:var(--space-2);resize:vertical;line-height:var(--line-height)}
.input:focus{border-color:var(--color-primary);outline:3px solid var(--color-focus);outline-offset:2px}
.input[readonly]{background:var(--color-surface)}
.input[aria-invalid="true"]{border-color:var(--color-danger)}
.field-error{display:flex;align-items:center;gap:var(--space-1);color:var(--color-danger);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium)}

/* 清單 */
.list-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-2)}
.legend{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.table-wrap{overflow-x:auto}
table.worklist{width:100%;border-collapse:collapse;min-width:1120px}
.worklist th{position:sticky;top:0;padding:0;background:var(--color-surface);border-bottom:1px solid var(--color-border);text-align:left}
.worklist th button{display:flex;align-items:center;gap:var(--space-1);width:100%;height:var(--row-height);padding:0 var(--space-3);border:0;background:transparent;
  font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);text-align:left;cursor:pointer}
.worklist th button:hover{background:var(--color-border)}
.worklist th .arrow{min-width:10px;color:var(--color-text-muted)}
.worklist td{height:var(--row-height);padding:0 var(--space-3);border-bottom:1px solid var(--color-border);background:var(--color-bg);white-space:nowrap}
.worklist td:first-child{position:relative}
.worklist tr.st-pending td{background:var(--status-pending-bg)}
.worklist tr.st-done td{background:var(--status-done-bg)}
.worklist tr.st-cert td{background:var(--status-certified-bg)}
.worklist tr.is-open{cursor:pointer}
.worklist tr.is-open:hover td{box-shadow:inset 0 1px 0 var(--color-border-input),inset 0 -1px 0 var(--color-border-input)}
.worklist tr.is-selected td{box-shadow:inset 0 2px 0 var(--color-primary),inset 0 -2px 0 var(--color-primary)}
.worklist tr.is-selected td:first-child{box-shadow:inset 0 2px 0 var(--color-primary),inset 0 -2px 0 var(--color-primary),inset 2px 0 0 var(--color-primary)}
.worklist tr.is-selected td:last-child{box-shadow:inset 0 2px 0 var(--color-primary),inset 0 -2px 0 var(--color-primary),inset -2px 0 0 var(--color-primary)}
.worklist tr:focus-visible{outline:3px solid var(--color-focus);outline-offset:-3px}
.worklist tr.is-locked td{background:var(--color-surface);color:var(--color-text-muted)}
.worklist tr.is-locked{cursor:not-allowed}
.worklist tr.is-dc td:first-child::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--status-marker-width);background:var(--status-dc)}
.id-cell{display:flex;align-items:center;gap:var(--space-2);font-weight:var(--font-weight-medium)}
.unassigned{color:var(--color-text-muted)}
.empty{padding:var(--space-6);text-align:center;color:var(--color-text-muted)}

/* 打報告畫面 */
.rp-bar{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3)}
.rp-title{font-size:var(--font-size-lg);font-weight:var(--font-weight-bold)}
.rp-progress{margin-left:auto;color:var(--color-text-muted)}
.rp-progress strong{color:var(--status-pending);font-size:var(--font-size-lg)}
.patient{padding:var(--space-3) var(--space-4);margin-bottom:var(--space-3)}
.patient dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--space-2) var(--space-4);margin:0}
.patient dt{font-size:var(--font-size-sm);color:var(--color-text-muted)}
.patient dd{margin:0;font-weight:var(--font-weight-medium)}
.neighbors{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:var(--space-2);margin-bottom:var(--space-3)}
.nb{display:flex;flex-direction:column;gap:var(--space-1);min-width:0;padding:var(--space-2) var(--space-3)}
.nb-cur{background:var(--color-primary-soft);border-color:var(--color-primary);box-shadow:inset 0 0 0 1px var(--color-primary)}
.nb-dir{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:var(--color-text-muted)}
.nb-line{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.nb-id{font-weight:var(--font-weight-bold)}
.nb-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(380px,1fr);gap:var(--space-3);align-items:start}
.viewer{position:sticky;top:calc(var(--control-height) + var(--space-4) + var(--space-3))}
.viewer-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);height:calc(100vh - 300px);min-height:420px;
  padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-image-bg);color:var(--color-image-text);text-align:center}
.viewer-label{font-size:var(--font-size-xl);font-weight:var(--font-weight-bold)}
.viewer-note{font-size:var(--font-size-sm)}
.report{display:flex;flex-direction:column}
.report-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border)}
.report-head h2{font-size:var(--font-size-lg);font-weight:var(--font-weight-bold)}
.report-body{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4)}
.notice{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border:1px solid;border-radius:var(--radius);font-size:var(--font-size-sm)}
.notice.dc{color:var(--status-dc);background:var(--status-dc-bg);border-color:var(--status-dc-border)}
.notice.lock{color:var(--status-certified);background:var(--status-certified-bg);border-color:var(--status-certified-border)}
.his{padding:var(--space-2) var(--space-3);border:1px dashed var(--color-border-input);border-radius:var(--radius);background:var(--color-surface);font-size:var(--font-size-sm)}
.his strong{display:block;font-weight:var(--font-weight-medium)}
.field{display:flex;flex-direction:column;gap:var(--space-1)}
.phrases{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.chip{padding:0 var(--space-2);border:1px solid var(--color-border-input);border-radius:var(--radius-pill);background:var(--color-bg);
  font-size:var(--font-size-sm);line-height:var(--line-height);cursor:pointer}
.chip:hover:not(:disabled){background:var(--color-primary-soft);border-color:var(--color-primary);color:var(--color-primary)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.no-phrase{font-size:var(--font-size-sm);color:var(--color-text-muted)}
.actions{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);flex-wrap:wrap;
  padding:var(--space-3) var(--space-4);border-top:1px solid var(--color-border);background:var(--color-bg);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.actions .grp{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.dirty{font-size:var(--font-size-sm);color:var(--color-text-muted)}

/* 提示與對話框 */
.toast{position:fixed;left:50%;bottom:var(--space-6);z-index:30;max-width:90vw;padding:var(--space-2) var(--space-4);border-radius:var(--radius-lg);
  background:var(--color-text);color:var(--color-bg);box-shadow:var(--shadow-overlay);transform:translate(-50%,var(--space-4));opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--color-danger)}
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:var(--space-4);background:var(--color-overlay)}
.dialog{width:100%;max-width:420px;padding:var(--space-6);border-radius:var(--radius-lg);background:var(--color-bg);box-shadow:var(--shadow-overlay)}
.dialog h2{margin-bottom:var(--space-2);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold)}
.dialog p{margin-bottom:var(--space-4);color:var(--color-text-muted)}

@media (max-width:1000px){
  .rp-main{grid-template-columns:1fr}
  .viewer{position:static}
  .viewer-box{height:300px;min-height:0}
  .neighbors{grid-template-columns:1fr}
  .summary-total{border-right:0;padding-right:0}
  .f-wide{grid-column:auto}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">影像報告系統<span class="role-tag">醫師端</span></div>
  <div>登入：<strong>醫師甲</strong></div>
</header>

<main>
  <section id="list-view" aria-label="醫師工作清單">
    <section class="card summary" aria-labelledby="summary-title">
      <div class="summary-total">
        <h2 id="summary-title" class="summary-label"></h2>
        <div><span id="summary-num" class="summary-num">0</span><span class="summary-unit">份</span></div>
      </div>
      <div id="summary-cats" class="summary-cats" role="group" aria-label="依檢查類別篩選"></div>
    </section>

    <form id="filters" class="card filters" onsubmit="return false" aria-label="搜尋條件">
      <div class="f"><label class="f-label" for="f-from">檢查日期（起）</label><input class="input" type="date" id="f-from"></div>
      <div class="f"><label class="f-label" for="f-to">檢查日期（迄）</label><input class="input" type="date" id="f-to"></div>
      <div class="f"><label class="f-label" for="f-status">報告狀態</label><select class="input" id="f-status"></select></div>
      <div class="f"><label class="f-label" for="f-cat">檢查類別</label><select class="input" id="f-cat"></select></div>
      <div class="f"><label class="f-label" for="f-unit">開單單位</label><select class="input" id="f-unit"></select></div>
      <div class="f"><label class="f-label" for="f-orderDr">開單醫師</label><select class="input" id="f-orderDr"></select></div>
      <div class="f"><label class="f-label" for="f-rptDr">報告醫師</label><select class="input" id="f-rptDr"></select></div>
      <div class="f f-wide"><label class="f-label" for="f-kw">單號／身分證字號</label><input class="input" type="search" id="f-kw" placeholder="輸入單號或身分證字號"></div>
      <div class="f"><button type="button" id="f-reset" class="btn">重設條件</button></div>
    </form>

    <div class="list-meta">
      <span id="list-count" class="muted"></span>
      <span id="legend" class="legend" aria-label="圖例"></span>
    </div>

    <div class="card table-wrap">
      <table class="worklist">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section id="report-view" aria-label="打報告畫面" hidden></section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="done" class="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="done-title">
    <h2 id="done-title">未完成報告已全部完成</h2>
    <p>目前清單中沒有其他未完成的報告。</p>
    <button type="button" class="btn" id="done-back">返回工作清單</button>
  </div>
</div>

<script>
/* ===== 模擬資料（案例文件提供，皆為虛構測試值） ===== */
const EXAMS = [
  {id:'R0001',dt:'2026-11-02 08:40',cat:'健檢胸部X光',name:'胸部X光數位攝影',unit:'健檢中心',orderDr:'醫師丁',pt:'測試一號',sex:'男',age:45,pid:'TEST000001',order:'正常',img:'已照',status:'未完成',rptDr:'醫師甲'},
  {id:'R0002',dt:'2026-11-02 09:05',cat:'健檢乳攝',name:'2D+3D乳房攝影',unit:'健檢中心',orderDr:'醫師丁',pt:'測試二號',sex:'女',age:52,pid:'TEST000002',order:'正常',img:'已照',status:'未完成',rptDr:'醫師甲'},
  {id:'R0003',dt:'2026-11-02 09:30',cat:'門診放射',name:'胸部X光（正面）',unit:'肝膽腸胃科',orderDr:'醫師戊',pt:'測試三號',sex:'男',age:63,pid:'TEST000003',order:'正常',img:'已照',status:'已完成',rptDr:'醫師甲',
    report:{Finding:'No active lung lesion.',Impression:'No significant abnormality.'}},
  {id:'R0004',dt:'2026-11-02 10:10',cat:'門診放射',name:'腹部X光',unit:'肝膽腸胃科',orderDr:'醫師戊',pt:'測試四號',sex:'女',age:58,pid:'TEST000004',order:'已DC',img:'已照',status:'未完成',rptDr:'醫師甲'},
  {id:'R0005',dt:'2026-11-02 10:45',cat:'健檢胸部X光',name:'胸部X光數位攝影',unit:'健檢中心',orderDr:'醫師丁',pt:'測試五號',sex:'女',age:38,pid:'TEST000005',order:'正常',img:'已照',status:'已認證',rptDr:'醫師丙',
    report:{Lung:'No active lung lesion.',Others:'Normal heart size.',Suggestion:'Follow-up as clinically indicated.'}},
  {id:'R0006',dt:'2026-11-02 11:20',cat:'心臟超音波',name:'心臟超音波',unit:'心臟內科',orderDr:'醫師己',pt:'測試六號',sex:'男',age:71,pid:'TEST000006',order:'正常',img:'已照',status:'未完成',rptDr:'未指派'},
  {id:'R0007',dt:'2026-11-03 08:50',cat:'頸動脈超音波',name:'頸動脈超音波',unit:'神經內科',orderDr:'醫師庚',pt:'測試七號',sex:'女',age:66,pid:'TEST000007',order:'正常',img:'已照',status:'未完成',rptDr:'醫師丙'},
  {id:'R0008',dt:'2026-11-03 09:15',cat:'健檢乳攝',name:'2D+3D乳房攝影',unit:'健檢中心',orderDr:'醫師丁',pt:'測試八號',sex:'女',age:47,pid:'TEST000008',order:'已DC',img:'未照',status:'未完成',rptDr:'未指派'},
  {id:'R0009',dt:'2026-11-03 09:40',cat:'健檢胸部X光',name:'胸部X光數位攝影',unit:'健檢中心',orderDr:'醫師丁',pt:'測試九號',sex:'男',age:55,pid:'TEST000009',order:'正常',img:'未照',status:'未完成',rptDr:'未指派'},
  {id:'R0010',dt:'2026-11-03 10:20',cat:'門診放射',name:'胸部X光（正面）',unit:'家醫科',orderDr:'醫師辛',pt:'測試十號',sex:'男',age:49,pid:'TEST000010',order:'正常',img:'已照',status:'未完成',rptDr:'醫師甲'},
];

const CATS = ['健檢胸部X光','健檢乳攝','門診放射','心臟超音波','頸動脈超音波'];
const TEMPLATES = {
  '門診放射':    {title:'門診放射科報告',       fields:['Finding','Impression']},
  '健檢胸部X光': {title:'健檢：胸部X光數位攝影', fields:['Lung','Others','Suggestion']},
  '健檢乳攝':    {title:'健檢：2D+3D 乳攝',     fields:['Findings','Diagnosis']},
  '心臟超音波':  {title:'心臟超音波',           fields:['Findings','Impression']},
  '頸動脈超音波':{title:'頸動脈超音波',         fields:['Findings','Impression']},
};
const PHRASES = {
  '健檢胸部X光':{Lung:['No active lung lesion.','Increased lung markings in both lungs.'],
                 Others:['Normal heart size.','Mild scoliosis of thoracic spine.'],
                 Suggestion:['Follow-up as clinically indicated.','Suggest further evaluation with chest CT.']},
  '健檢乳攝':{Findings:['Scattered areas of fibroglandular density.'],
              Diagnosis:['BI-RADS 1: Negative.','BI-RADS 2: Benign finding.']},
  '門診放射':{Finding:['No active lung lesion.','No obvious bony abnormality.'],
              Impression:['No significant abnormality.']},
};
const STATUSES = ['未完成','已完成','已認證'];
const ST_CLASS = {'未完成':'pending','已完成':'done','已認證':'cert'};
const LOGIN_DR = '醫師甲';

/* 狀態圖示：內嵌 SVG（設計系統規定不使用文字符號） */
const ICON_PATH = {
  pending:'<circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  done:'<circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/>',
  cert:'<circle cx="8" cy="8" r="6.5" fill="currentColor"/><path d="M5 8.2l2 2 4-4.2" fill="none" stroke="var(--color-bg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  dc:'<circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.2 11.8l7.6-7.6" stroke="currentColor" stroke-width="1.8"/>',
  noimg:'<rect x="2.5" y="3.5" width="11" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 14L14 2" stroke="currentColor" stroke-width="1.5"/>',
  alert:'<circle cx="8" cy="8" r="6.5" fill="currentColor"/><path d="M8 4.5v4.2M8 11v.3" stroke="var(--color-bg)" stroke-width="1.8" stroke-linecap="round"/>',
  lock:'<rect x="3.5" y="7" width="9" height="6.5" rx="1.2" fill="currentColor"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="currentColor" stroke-width="1.6"/>',
};
const icon = k => `<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${ICON_PATH[k]}</svg>`;
const DC_LABEL = '醫令已DC';

const COLS = [
  {k:'status',label:'報告狀態'},{k:'id',label:'單號'},{k:'date',label:'檢查日期'},{k:'time',label:'檢查時間'},
  {k:'cat',label:'檢查類別'},{k:'name',label:'檢查名稱'},{k:'pt',label:'病人（性別／年齡）'},{k:'pid',label:'身分證字號'},
  {k:'unit',label:'開單單位'},{k:'orderDr',label:'開單醫師'},{k:'rptDr',label:'報告醫師'},{k:'img',label:'影像'},
];

const state = { sort:{k:'date',dir:1}, queue:[], currentId:null, selectedId:null };
const $ = s => document.querySelector(s);
const get = id => EXAMS.find(e => e.id === id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq = arr => [...new Set(arr)];
const statusBadge = s => `<span class="badge st-${ST_CLASS[s]}">${icon(ST_CLASS[s])}${s}</span>`;
const badge = e => statusBadge(e.status);
const dcBadge = () => `<span class="badge dc">${icon('dc')}${DC_LABEL}</span>`;
const noImgBadge = () => `<span class="badge neutral">${icon('noimg')}未照影像</span>`;
const canOpen = e => e.img === '已照';

/* 依放射師訪談：已DC 且未照 → 從清單移除；已DC 但已照 → 保留並標示 */
const inList = e => !(e.order === '已DC' && e.img === '未照');

/* ===== 篩選 ===== */
function fillSelect(id, opts, value){
  $(id).innerHTML = opts.map(o => `<option${o===value?' selected':''}>${esc(o)}</option>`).join('');
}
function initFilters(){
  fillSelect('#f-status', ['全部',...STATUSES], '全部');
  fillSelect('#f-cat', ['全部',...CATS], '全部');
  fillSelect('#f-unit', ['全部',...uniq(EXAMS.map(e=>e.unit))], '全部');
  fillSelect('#f-orderDr', ['全部',...uniq(EXAMS.map(e=>e.orderDr))], '全部');
  fillSelect('#f-rptDr', ['全部',...uniq(EXAMS.map(e=>e.rptDr))], LOGIN_DR);
  $('#f-from').value = ''; $('#f-to').value = ''; $('#f-kw').value = '';
}
function getFilters(){
  return {from:$('#f-from').value, to:$('#f-to').value, status:$('#f-status').value, cat:$('#f-cat').value,
          unit:$('#f-unit').value, orderDr:$('#f-orderDr').value, rptDr:$('#f-rptDr').value, kw:$('#f-kw').value.trim().toUpperCase()};
}
const matchDr = (e,dr) => dr === '全部' || e.rptDr === dr;
function filtered(){
  const f = getFilters();
  return EXAMS.filter(e => {
    if(!inList(e) || !matchDr(e,f.rptDr)) return false;
    if(f.status !== '全部' && e.status !== f.status) return false;
    if(f.cat !== '全部' && e.cat !== f.cat) return false;
    if(f.unit !== '全部' && e.unit !== f.unit) return false;
    if(f.orderDr !== '全部' && e.orderDr !== f.orderDr) return false;
    const d = e.dt.slice(0,10);
    if(f.from && d < f.from) return false;
    if(f.to && d > f.to) return false;
    if(f.kw && !e.id.toUpperCase().includes(f.kw) && !e.pid.toUpperCase().includes(f.kw)) return false;
    return true;
  });
}
function sortVal(e,k){
  if(k === 'date') return e.dt;
  if(k === 'time') return e.dt.slice(11);
  if(k === 'status') return STATUSES.indexOf(e.status);
  return e[k];
}
function sorted(list){
  const {k,dir} = state.sort;
  return [...list].sort((a,b) => {
    const va = sortVal(a,k), vb = sortVal(b,k);
    const c = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb),'zh-Hant',{numeric:true});
    return (c || a.dt.localeCompare(b.dt)) * (c ? dir : 1);
  });
}

/* ===== 工作清單 ===== */
function renderLegend(){
  $('#legend').innerHTML = STATUSES.map(statusBadge).join('') + dcBadge() + noImgBadge();
}
function renderSummary(){
  const f = getFilters();
  const pending = EXAMS.filter(e => inList(e) && canOpen(e) && e.status === '未完成' && matchDr(e,f.rptDr));
  const who = f.rptDr === '全部' ? '全部醫師' : f.rptDr;
  $('#summary-title').textContent = `${who}・未完成報告`;
  $('#summary-num').textContent = pending.length;
  const chip = (cat,label,n) => `<button type="button" class="cat-chip ${n?'has':'zero'}" data-cat="${esc(cat)}" aria-pressed="${f.cat===cat}">
      <span class="n">${n}</span><span class="t">${esc(label)}</span></button>`;
  $('#summary-cats').innerHTML = chip('全部','全部類別',pending.length) +
    CATS.map(c => chip(c,c,pending.filter(e=>e.cat===c).length)).join('');
}
function renderHead(){
  $('#thead').innerHTML = '<tr>' + COLS.map(c => {
    const on = state.sort.k === c.k;
    const aria = on ? (state.sort.dir === 1 ? 'ascending' : 'descending') : 'none';
    return `<th aria-sort="${aria}"><button type="button" data-sort="${c.k}">${c.label}<span class="arrow" aria-hidden="true">${on?(state.sort.dir===1?'▲':'▼'):''}</span></button></th>`;
  }).join('') + '</tr>';
}
function renderBody(){
  const rows = sorted(filtered());
  $('#list-count').textContent = `共 ${rows.length} 筆・點選列開啟報告`;
  if(!rows.length){ $('#tbody').innerHTML = `<tr><td class="empty" colspan="${COLS.length}">沒有符合條件的檢查</td></tr>`; return; }
  $('#tbody').innerHTML = rows.map(e => {
    const open = canOpen(e), dc = e.order === '已DC';
    const cls = [`st-${ST_CLASS[e.status]}`, dc?'is-dc':'', open?'is-open':'is-locked', e.id===state.selectedId?'is-selected':''].join(' ');
    return `<tr class="${cls}" data-id="${e.id}" tabindex="${open?0:-1}" ${e.id===state.selectedId?'aria-selected="true"':''} aria-label="${e.id} ${e.pt} ${e.name} ${e.status}${dc?' '+DC_LABEL:''}${open?'':' 未照影像'}">
      <td>${badge(e)}</td>
      <td><span class="id-cell">${e.id}${dc?dcBadge():''}</span></td>
      <td>${e.dt.slice(0,10)}</td><td>${e.dt.slice(11)}</td>
      <td>${esc(e.cat)}</td><td>${esc(e.name)}</td>
      <td>${esc(e.pt)}（${e.sex}／${e.age}）</td><td>${e.pid}</td>
      <td>${esc(e.unit)}</td><td>${esc(e.orderDr)}</td>
      <td>${e.rptDr==='未指派'?'<span class="unassigned">未指派</span>':esc(e.rptDr)}</td>
      <td>${open?'已照':noImgBadge()}</td></tr>`;
  }).join('');
}
function updateList(){ renderSummary(); renderHead(); renderBody(); }

/* ===== 打報告畫面 ===== */
function openReport(id){
  state.queue = sorted(filtered()).filter(canOpen).map(e => e.id);   // 以進入時的清單順序作為工作佇列
  if(!state.queue.includes(id)) state.queue.push(id);
  state.currentId = id;
  $('#list-view').hidden = true;
  $('#report-view').hidden = false;
  renderReport();
}
function nbInfo(e){
  return `<span class="nb-line"><span class="nb-id">${e.id}</span>${badge(e)}${e.order==='已DC'?dcBadge():''}</span>
          <span class="nb-name">${esc(e.pt)}・${esc(e.name)}</span>`;
}
function renderReport(){
  const e = get(state.currentId), tpl = TEMPLATES[e.cat], q = state.queue, i = q.indexOf(e.id);
  const prev = i > 0 ? get(q[i-1]) : null, next = i < q.length-1 ? get(q[i+1]) : null;
  const remaining = q.filter(id => get(id).status === '未完成').length;
  const locked = e.status === '已認證', dc = e.order === '已DC';
  const vals = e.draft || e.report || {};
  const phr = PHRASES[e.cat] || {};

  $('#report-view').innerHTML = `
    <div class="rp-bar">
      <button type="button" class="btn" id="rp-back">← 返回工作清單</button>
      <h1 class="rp-title" id="rp-title" tabindex="-1">打報告　<span class="muted">${e.id}</span></h1>
      <div class="rp-progress">第 ${i+1} / ${q.length} 筆・本清單未完成 <strong>${remaining}</strong> 份</div>
    </div>

    <section class="card patient" aria-label="個案資訊">
      <dl>
        <div><dt>姓名</dt><dd>${esc(e.pt)}</dd></div>
        <div><dt>性別／年齡</dt><dd>${e.sex}／${e.age}</dd></div>
        <div><dt>身分證字號</dt><dd>${e.pid}</dd></div>
        <div><dt>檢查名稱</dt><dd>${esc(e.name)}</dd></div>
        <div><dt>檢查日期時間</dt><dd>${e.dt}</dd></div>
        <div><dt>開單日期</dt><dd title="模擬資料未提供">—</dd></div>
        <div><dt>開單單位</dt><dd>${esc(e.unit)}</dd></div>
        <div><dt>開單醫師</dt><dd>${esc(e.orderDr)}</dd></div>
        <div><dt>報告醫師</dt><dd>${esc(e.rptDr)}</dd></div>
      </dl>
    </section>

    <section class="neighbors" aria-label="上一筆、目前、下一筆">
      <div class="card nb"><span class="nb-dir">上一筆</span>${prev?nbInfo(prev):'<span class="muted">已是第一筆</span>'}</div>
      <div class="card nb nb-cur" aria-current="true"><span class="nb-dir">目前</span>${nbInfo(e)}</div>
      <div class="card nb"><span class="nb-dir">下一筆</span>${next?nbInfo(next):'<span class="muted">已是最後一筆</span>'}</div>
    </section>

    <div class="rp-main">
      <section class="viewer" aria-label="影像顯示區">
        <div class="viewer-box">
          <div class="viewer-label">影像顯示區</div>
          <div>${esc(e.name)}・${e.id}</div>
          <div class="viewer-note">PACS 影像示意（雛型未串接）</div>
        </div>
      </section>

      <section class="card report" aria-labelledby="tpl-title">
        <div class="report-head"><h2 id="tpl-title">${esc(tpl.title)}</h2>${badge(e)}</div>
        <div class="report-body">
          ${dc ? `<div class="notice dc" role="note">${icon('dc')}${DC_LABEL}（檢查已照影像），請確認是否仍需撰寫報告。</div>` : ''}
          ${locked ? `<div class="notice lock" role="note">${icon('lock')}此報告已認證，內容不可修改。</div>` : ''}
          ${e.cat === '門診放射' ? '<div class="his"><strong>HIS 診斷、S、O</strong><span class="muted">（示意位置，雛型未串接 HIS）</span></div>' : ''}
          ${tpl.fields.map(f => `
            <div class="field">
              <label class="field-label" for="fld-${f}">${f}</label>
              ${(phr[f]||[]).length
                ? `<div class="phrases" role="group" aria-label="${f} 片語">${phr[f].map(p => `<button type="button" class="chip" data-field="${f}" data-phrase="${esc(p)}" ${locked?'disabled':''}>＋ ${esc(p)}</button>`).join('')}</div>`
                : '<p class="no-phrase">此範本尚未設定片語</p>'}
              <textarea class="input" id="fld-${f}" data-field="${f}" ${locked?'readonly':''}>${esc(vals[f]||'')}</textarea>
            </div>`).join('')}
          <p class="field-error" id="fld-error" hidden>${icon('alert')}請至少填寫一個欄位再儲存</p>
        </div>
        <div class="actions">
          <div class="grp">
            <button type="button" class="btn" data-go="${i-1}" ${prev?'':'disabled'}>← 上一筆</button>
            <button type="button" class="btn" data-go="${i+1}" ${next?'':'disabled'}>下一筆 →</button>
          </div>
          <div class="grp">
            <span id="dirty" class="dirty" ${e.draft?'':'hidden'}>● 尚未儲存</span>
            <button type="button" class="btn btn-primary" id="act-save" ${locked?'disabled':''}>儲存並跳下一筆 <kbd>Ctrl+S</kbd></button>
            <button type="button" class="btn" id="act-cert" ${locked?'disabled':''}>認證並跳下一筆</button>
          </div>
        </div>
      </section>
    </div>`;
  window.scrollTo(0,0);
  $('#rp-title').focus({preventScroll:true});
}
function nextUnfinished(fromId){
  const q = state.queue, i = q.indexOf(fromId);
  return [...q.slice(i+1), ...q.slice(0,i)].find(id => get(id).status === '未完成' && canOpen(get(id)));
}
function setFieldError(on){
  document.querySelectorAll('#report-view textarea').forEach(t => {
    if(on){ t.setAttribute('aria-invalid','true'); t.setAttribute('aria-describedby','fld-error'); }
    else { t.removeAttribute('aria-invalid'); t.removeAttribute('aria-describedby'); }
  });
  const msg = $('#fld-error'); if(msg) msg.hidden = !on;
}
function commit(kind){
  const e = get(state.currentId);
  if(e.status === '已認證') return;
  const vals = {};
  document.querySelectorAll('#report-view textarea').forEach(t => vals[t.dataset.field] = t.value.trim());
  if(Object.values(vals).every(v => !v)){
    setFieldError(true);
    toast('請至少填寫一個欄位再儲存', true);
    $('#report-view textarea')?.focus();
    return;
  }
  e.report = vals; e.draft = null;
  e.status = kind === 'cert' ? '已認證' : '已完成';
  const verb = kind === 'cert' ? '認證' : '儲存';
  const n = nextUnfinished(e.id);
  if(n){
    state.currentId = n;
    renderReport();
    toast(`${e.id} 已${verb}，已跳到下一筆未完成：${n}`);
  }else{
    renderReport();
    toast(`${e.id} 已${verb}`);
    $('#done').hidden = false;
    $('#done-back').focus();
  }
}
function backToList(){
  $('#done').hidden = true;
  $('#report-view').hidden = true;
  $('#list-view').hidden = false;
  state.selectedId = state.currentId;
  updateList();
  document.querySelector(`#tbody tr[data-id="${state.currentId}"]`)?.focus();
}

/* ===== 提示 ===== */
let toastTimer;
function toast(msg, warn){
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('warn', !!warn); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ===== 事件 ===== */
$('#filters').addEventListener('input', updateList);
$('#filters').addEventListener('change', updateList);
$('#f-reset').addEventListener('click', () => { initFilters(); updateList(); });
$('#summary-cats').addEventListener('click', ev => {
  const b = ev.target.closest('[data-cat]'); if(!b) return;
  $('#f-cat').value = b.dataset.cat; updateList();
});
$('#thead').addEventListener('click', ev => {
  const b = ev.target.closest('[data-sort]'); if(!b) return;
  const k = b.dataset.sort;
  state.sort = state.sort.k === k ? {k, dir:-state.sort.dir} : {k, dir:1};
  renderHead(); renderBody();
});
function rowActivate(tr){
  if(!tr) return;
  const e = get(tr.dataset.id);
  if(!canOpen(e)){ toast(`${e.id} 尚未照影像，無法撰寫報告`, true); return; }
  openReport(e.id);
}
$('#tbody').addEventListener('click', ev => rowActivate(ev.target.closest('tr[data-id]')));
$('#tbody').addEventListener('keydown', ev => {
  if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); rowActivate(ev.target.closest('tr[data-id]')); }
});

$('#report-view').addEventListener('click', ev => {
  const t = ev.target;
  if(t.closest('#rp-back')) return backToList();
  if(t.closest('#act-save')) return commit('save');
  if(t.closest('#act-cert')) return commit('cert');
  const go = t.closest('[data-go]');
  if(go && !go.disabled){ const id = state.queue[+go.dataset.go]; if(id){ state.currentId = id; renderReport(); } return; }
  const chip = t.closest('.chip');
  if(chip){
    const ta = $(`#fld-${chip.dataset.field}`);
    const cur = ta.value.replace(/\s+$/,'');
    ta.value = cur ? cur + '\n' + chip.dataset.phrase : chip.dataset.phrase;
    ta.dispatchEvent(new Event('input', {bubbles:true}));
    ta.focus();
  }
});
$('#report-view').addEventListener('input', ev => {
  if(ev.target.tagName !== 'TEXTAREA') return;
  const e = get(state.currentId);
  e.draft = e.draft || {...(e.report || {})};
  e.draft[ev.target.dataset.field] = ev.target.value;
  $('#dirty').hidden = false;
  setFieldError(false);
});
document.addEventListener('keydown', ev => {
  if(!$('#done').hidden && ev.key === 'Escape'){ backToList(); return; }
  if(!$('#report-view').hidden && (ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's'){
    ev.preventDefault(); commit('save');
  }
});
$('#done-back').addEventListener('click', backToList);

initFilters();
renderLegend();
updateList();
</script>
</body>
